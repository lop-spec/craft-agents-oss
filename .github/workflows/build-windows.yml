name: Build Windows

# Windows installer for the lop branch. Installers are built here only, never on
# a local machine. Run it from the Actions tab or push a tag such as lop-v0.15.6-1.

on:
  workflow_dispatch:
  push:
    tags:
      - "lop-v*"

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build installer
        shell: pwsh
        run: ./apps/electron/scripts/build-win.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned build: no certificate is configured for this fork.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: craft-agents-windows-x64
          path: |
            apps/electron/release/*.exe
            apps/electron/release/*.exe.blockmap
            apps/electron/release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            apps/electron/release/*.exe
            apps/electron/release/latest.yml
